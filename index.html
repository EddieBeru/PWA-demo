<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacMan en PWA</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/pacman.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pacman PWA">

    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <button class="btn-install" id="installBtn">Instalar en el dispositivo</button>

    <div class="container">

        <div class="banner">
            <span>Juega PacMan incluso sin conexión a internet!</span>
        </div>

        <div id="game-wrapper">
            <div id="game-banner">
                <span>SCORE</span>
                <span id="game-score">0</span>
            </div>
            <canvas style="image-rendering: pixelated; image-rendering: crisp-edges;" id="game-canvas"
                class="blurred"></canvas>

            <div id="game-overlay">
                <h2 id="overlay-title">READY?</h2>
                <button id="play-button">START</button>
            </div>
        </div>

        <!-- Virtual D-pad controls for mobile -->
        <div id="dpad-container" class="mobile-only">
            <div class="dpad-btn up" id="dpad-up">▲</div>
            <div class="dpad-middle"></div>
            <div class="dpad-btn left" id="dpad-left">◀</div>
            <div class="dpad-btn right" id="dpad-right">▶</div>
            <div class="dpad-btn down" id="dpad-down">▼</div>
        </div>

    </div>

    <script src="app.js"></script>
    <script type="module" src="game/main.js"></script>
</body>

</html>
